
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Puzzle Video 5x5</title>
    <style>
	<br>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f2b1d, #1a4a34);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 { margin-bottom: 25px; font-size: 24px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        
        /* Containerul principal care așază elementele pe orizontală */
        .joc-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px; /* Spațiul dintre butoane, puzzle și cronometru */
            min-width: 800px;
        }

        /* Zona din stânga pentru butoane (aranjate vertical, unul sub altul) */
        .zona-stanga {
            width: 180px;
            display: flex;
            flex-direction: column;
            gap: 15px; /* Spațiul vertical dintre cele două butoane */
            align-items: flex-end; /* Aliniere la marginea dinspre puzzle */
        }

        /* Zona din dreapta pentru cronometru */
        .zona-dreapta {
            width: 180px;
            display: flex;
            justify-content: flex-start;
        }

        #cronometru {
            font-size: 20px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            white-space: nowrap;
        }

        .p-container {
            position: relative;
            width: 500px;
            height: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border-radius: 8px;
            overflow: hidden;
            background: #222;
        }
        #video-sursa { display: none; }
        
        .puzzle-grid {
            display: grid;
            grid-template-columns: repeat(5, 100px);
            grid-template-rows: repeat(5, 100px);
            width: 500px;
            height: 500px;
        }
        canvas {
            width: 100px;
            height: 100px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-sizing: border-box;
            cursor: pointer;
            transition: transform 0.1s, border-color 0.2s;
        }
        canvas:hover {
            border-color: #00d2ff;
            transform: scale(0.98);
        }
        canvas.selectat {
            border: 3px solid #ff0055 !important;
            box-shadow: 0 0 15px #ff0055;
            z-index: 10;
        }
        
        /* Stil general pentru butoane */
        button {
            width: 160px; /* Dimensiune fixă egală pentru ambele butoane */
            padding: 12px 15px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        
        /* Stil buton Amestecă */
        .btn-amesteca {
            background: #00d2ff;
            color: #111;
            box-shadow: 0 4px 15px rgba(0,210,255,0.4);
        }
        .btn-amesteca:hover { background: #fff; transform: translateY(-2px); }

        /* Stil buton Oprește */
        .btn-opreste {
            background: #ff3b30;
            color: #fff;
            box-shadow: 0 4px 15px rgba(255,59,48,0.4);
        }
        .btn-opreste:hover { background: #ff453a; transform: translateY(-2px); }
        
        #mesaj {
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
            color: #00ff88;
            height: 25px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<br>
<body>
    <div class="joc-container">
        <!-- Butonul Oprește este așezat structural sub butonul Amestecă -->
        <div class="zona-stanga">
            <button class="btn-amesteca" onclick="amestecaPuzzle()">Amestecă</button>
            <button class="btn-opreste" onclick="opresteJocul()">Oprește Jocul</button>
        </div>
        <div class="p-container">
            <video id="video-sursa" autoplay loop muted playsinline src="acvariu.mp4"></video>
            <div class="puzzle-grid" id="grila"></div>
        </div>

        <div class="zona-dreapta">
            <div id="cronometru">Timp: 00:00</div>
        </div>
    </div>

    <div id="mesaj"></div>

    <script>
        const video = document.getElementById('video-sursa');
        const grila = document.getElementById('grila');
        const mesaj = document.getElementById('mesaj');
        const cronometruElement = document.getElementById('cronometru');
        
        const DIM_GRID = 5;
        const DIM_PIESA = 100;
        let piese = [];
        let piesaSelectata = null;

        let timpInceput = null;
        let intervalCronometru = null;
        let jocActiv = false;

        function creeazaPuzzle() {
            grila.innerHTML = '';
            piese = [];
            for (let i = 0; i < DIM_GRID * DIM_GRID; i++) {
                let canvas = document.createElement('canvas');
                canvas.width = DIM_PIESA;
                canvas.height = DIM_PIESA;
                
                canvas.dataset.origX = (i % DIM_GRID) * DIM_PIESA;
                canvas.dataset.origY = Math.floor(i / DIM_GRID) * DIM_PIESA;
                
                canvas.style.order = i;
                
                canvas.addEventListener('click', aduLaClick);
                grila.appendChild(canvas);
                piese.push(canvas);
            }
        }

        function randeazaVideo() {
            piese.forEach(canvas => {
                const ctx = canvas.getContext('2d');
                const xOrig = parseFloat(canvas.dataset.origX);
                const yOrig = parseFloat(canvas.dataset.origY);
                
                ctx.drawImage(video, xOrig, yOrig, DIM_PIESA, DIM_PIESA, 0, 0, DIM_PIESA, DIM_PIESA);
            });
            requestAnimationFrame(randeazaVideo);
        }

        function aduLaClick() {
            if (!jocActiv) return; 

            if (piesaSelectata === null) {
                piesaSelectata = this;
                this.classList.add('selectat');
            } else {
                if (piesaSelectata !== this) {
                    let tempOrder = piesaSelectata.style.order;
                    piesaSelectata.style.order = this.style.order;
                    this.style.order = tempOrder;
                    
                    verificaCastig();
                }
                piesaSelectata.classList.remove('selectat');
                piesaSelectata = null;
            }
        }

        function pornesteCronometru() {
            clearInterval(intervalCronometru);
            timpInceput = Date.now();
            intervalCronometru = setInterval(actualizeazaCronometru, 1000);
        }

        function actualizeazaCronometru() {
            let timpScurs = Math.floor((Date.now() - timpInceput) / 1000);
            cronometruElement.innerText = "Timp: " + formateazaTimp(timpScurs);
        }

        function formateazaTimp(secunde) {
            let minute = Math.floor(secunde / 60);
            let sec = secunde % 60;
            return (minute < 10 ? "0" : "") + minute + ":" + (sec < 10 ? "0" : "") + sec;
        }

        function amestecaPuzzle() {
            mesaj.innerText = "";
            jocActiv = true;
            pornesteCronometru();

            let pozitii = Array.from({length: 25}, (_, i) => i);
            
            for (let i = pozitii.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pozitii[i], pozitii[j]] = [pozitii[j], pozitii[i]];
            }
            
            piese.forEach((piesa, i) => {
                piesa.style.order = pozitii[i];
                piesa.classList.remove('selectat');
            });
            piesaSelectata = null;
        }

        function opresteJocul() {
            jocActiv = false;
            clearInterval(intervalCronometru); 
            
            piese.forEach((piesa, index) => {
                piesa.style.order = index;
                piesa.classList.remove('selectat');
            });
            
            if(piesaSelectata) piesaSelectata = null;
            mesaj.innerText = "Jocul a fost oprit.";
            mesaj.style.color = "#ff3b30"; 
        }

        function verificaCastig() {
            let castigat = piese.every((piesa, index) => parseInt(piesa.style.order) === index);
            if (castigat && jocActiv) {
                jocActiv = false;
                clearInterval(intervalCronometru); 
                let timpFinal = Math.floor((Date.now() - timpInceput) / 1000);
                mesaj.innerText = `Felicitări! Ai rezolvat puzzle-ul în ${formateazaTimp(timpFinal)}! 🎉`;
                mesaj.style.color = "#00ff88";             }          }
        creeazaPuzzle();
        video.addEventListener('play', () => {
            requestAnimationFrame(randeazaVideo);
        });
    </script>
</body>
</html>

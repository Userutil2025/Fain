<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Tudor Dinamic</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        
        #top-panel {
            background: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        #stats-text {
            font-size: 16px;
            font-weight: bold;
            text-align: left;
            line-height: 1.6;
        }

        #game-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0px; 
            max-width: 1200px;
            margin: 0 auto;
        }

        #board {
            display: grid;
            border: 3px solid #333;
            background-color: #fff; /* Revenit la fundalul alb original */
            width: 500px;
            height: 500px;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        .cell {
            border: 1px dashed #bbb; /* Revenit la liniile originale discrete */
            box-sizing: border-box;
            width: 100%;
            height: 100%;
        }

        #middle-preview {
            width: 100px;
            height: 100px;
            border-top: 3px solid #333;
            border-bottom: 3px solid #333;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        #preview-image {
            width: 80px;
            height: 80px;
            border: 2px solid #333;
            border-radius: 4px;
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            background-color: #ddd;
        }

        #pieces-pool {
            display: grid;
            width: 500px;
            height: 500px;
            border: 3px dashed #888;
            background-color: #e8e8e8;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .piece {
            cursor: grab;
            box-sizing: border-box;
            border: 1px solid rgba(0,0,0,0.15);
            background-repeat: no-repeat;
            width: 100%;
            height: 100%;
        }

        select, button {
            padding: 8px 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <h1 id="game-title">Puzzle Foto</h1>
    
    <div id="top-panel">
        <div>
            <label for="grid-select" style="font-weight: bold; margin-right: 5px;">Dimensiune:</label>
            <select id="grid-select" onchange="changeDifficulty()">
                <option value="4">4 x 4 (16 piese)</option>
                <option value="5" selected>5 x 5 (25 piese)</option>
                <option value="6">6 x 6 (36 piese)</option>
            </select>
        </div>
        <div id="stats-text">
            ⏱️ Timp: <span id="timer">0</span>s | 
            🏆 Record (<span id="record-label">5x5</span>): <span id="best-score">Fără record</span>
        </div>
        <div>
            <span style="margin-left: 15px; margin-right: 15px;">
              <label for="select-imagine">Imagine: </label>
              <select id="select-imagine" onchange="startGame()">
                <option value="poza1.jpg">Poza 1</option>
                <option value="poza2.jpg">Poza 2</option>
              </select>
            </span>
            <button id="btnReset" onclick="startGame()">Resetează Jocul</button> 
        </div>
    </div>

    <div id="game-container">
        <div id="board"></div>
        
        <div id="middle-preview">
            <div id="preview-image" title="Model de asamblare"></div>
            <span style="font-size: 11px; font-weight: bold; margin-top: 2px;">MODEL</span>
        </div>
        
        <div id="pieces-pool"></div>
    </div>

    <script>
        let ROWS = 5;
        let COLS = 5;
        let timerInterval;
        let timeElapsed = 0;

        // Imagini sigure de pe internet în caz că fișierele locale dau eroare sau au extensii diferite (.png, .jpeg, .JPG)
        const imaginiRezerva = {
            "poza1.jpg": "https://unsplash.com",
            "poza2.jpg": "https://unsplash.com"
        };

        window.onload = function() {
            loadBestScore();
            startGame();
        };

        function loadBestScore() {
            document.getElementById('record-label').innerText = `${ROWS}x${COLS}`;
            const savedScore = localStorage.getItem(`puzzle_best_${ROWS}x${COLS}`);
            document.getElementById('best-score').innerText = savedScore ? savedScore + "s" : "Fără record";
        }

        function changeDifficulty() {
            const select = document.getElementById('grid-select');
            ROWS = parseInt(select.value);
            COLS = parseInt(select.value);
            loadBestScore();
            startGame();
        }

        // Funcții goale (mock) pentru ca jocul să nu se blocheze dacă lipsesc din script
        if (typeof allowDrop === 'undefined') window.allowDrop = function(e) { e.preventDefault(); };
        if (typeof dropPiece === 'undefined') window.dropPiece = function(e) { e.preventDefault(); };
        if (typeof dragStart === 'undefined') window.dragStart = function(e) { };

        function verificaSiAplicaImagine(element, caleInitiala) {
            const img = new Image();
            img.src = caleInitiala;
            img.onload = function() {
                // Dacă imaginea locală există și se încarcă corect
                element.style.backgroundImage = `url('${caleInitiala}')`;
            };
            img.onerror = function() {
                // Dacă imaginea locală nu e găsită, aplică automat varianta online de rezervă
                element.style.backgroundImage = `url('${imaginiRezerva[caleInitiala]}')`;
            };
        }

        function startGame() {
            clearInterval(timerInterval);
            timeElapsed = 0;
            document.getElementById('timer').innerText = timeElapsed;

            const selectImagine = document.getElementById('select-imagine');
            const imagineCurenta = selectImagine.value;

            document.getElementById('game-title').innerText = `Puzzle Foto din ${imagineCurenta} (${ROWS * COLS} Piese)`;
            
            const preview = document.getElementById('preview-image');
            verificaSiAplicaImagine(preview, imagineCurenta);

            const board = document.getElementById('board');
            const pool = document.getElementById('pieces-pool');
            board.innerHTML = '';
            pool.innerHTML = '';

            board.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
            board.style.gridTemplateRows = `repeat(${ROWS}, 1fr)`;
            pool.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
            pool.style.gridTemplateRows = `repeat(${ROWS}, 1fr)`;

            pool.addEventListener('dragover', allowDrop);
            pool.addEventListener('drop', dropPiece);

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    cell.addEventListener('dragover', allowDrop);
                    cell.addEventListener('drop', dropPiece);
                    board.appendChild(cell);
                }
            }

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const piece = document.createElement('div');
                    piece.classList.add('piece');
                    piece.draggable = true;
                    piece.id = "piece-" + r + "-" + c;
                    piece.dataset.correctRow = r;
                    piece.dataset.correctCol = c;

                    // Aplică imaginea locală sau cea de siguranță online direct pe piesă
                    verificaSiAplicaImagine(piece, imagineCurenta);
                    piece.style.backgroundSize = `${COLS * 100}% ${ROWS * 100}%`;

                    let posX = COLS > 1 ? (c / (COLS - 1)) * 100 : 0;
                    let posY = ROWS > 1 ? (r / (ROWS - 1)) * 100 : 0;
                    piece.style.backgroundPosition = posX + "% " + posY + "%";

                    piece.addEventListener('dragstart', dragStart);
                    pool.appendChild(piece);
                }
            }
        }
    </script>
</body>
</html>

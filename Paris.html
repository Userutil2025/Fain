<!DOCTYPE html>
<html lang="ro"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <!-- Linia de mai jos asigură adaptarea perfectă pe ecranul telefonului -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="https://jsdelivr.net/">
    <title>Paris</title>
    <style>
        @keyframes wave {
            30% { background-position: 0 0; }
            60% { background-position: 100px 0; }
        }
        
        body {
            /* Fundal modificat în verde mediu uniform */
            background: #2e7d32; 
        <!--    background-image: 
                url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0,50 Q300,0 600,50 T1200,50 L1200,120 L0,120 Z" fill="%231b5e20" opacity="0.3"/></svg>'),
                url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0,60 Q300,20 600,60 T1200,60 L1200,120 L0,120 Z" fill="%231b5e20" opacity="0.4"/></svg>'),
                url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0,70 Q300,40 600,70 T1200,70 L1200,120 L0,120 Z" fill="%231b5e20" opacity="0.2"/></svg>');
            background-attachment: fixed;
            background-repeat: repeat-x; -->
            background-size: 100% 100px, 100% 100px, 100% 100px;
            background-position: 0 bottom, 0 calc(100% - 60px), 0 calc(100% - 30px);
            animation: wave 15s linear infinite;
            margin: 0;
            min-height: 100vh;
        }
        
        .button-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            padding: 20px 10px;
            max-width: 100%;
            box-sizing: border-box;
        }
        
        .button-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 115px; /* Mărit ușor pentru a compensa rotunjirea marginilor */
            height: 75px;
            border-radius: 25px; /* Margini rotunjite aplicate */
            background: #800020; /* Culoare vișinie (Burgundy) */
            color: white;
            border-top: 3px solid #a31c3f;
            border-left: 3px solid #a31c3f;
            border-bottom: 3px solid #4a0012;
            border-right: 3px solid #4a0012;
            font-weight: bold;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-size: 22px; /* Redus minimal pentru a preveni ieșirea textului din cercul rotunjit */
            transition: all 0.1s;
            cursor: pointer;
            box-shadow: inset 1px 1px 0 rgba(255,255,255,0.2), inset -1px -1px 0 rgba(0,0,0,0.3);
            word-wrap: break-word;
            overflow-wrap: break-word;
            line-height: 1.2;
            padding: 5px;
        }
        
        .button-link:active {
            transform: translate(1px, 1px);
            box-shadow: inset 2px 2px 0 rgba(0,0,0,0.3), inset -1px -1px 0 rgba(255,255,255,0.1);
        }
    </style>
</head>

<body>

<!-- Containerul inline aliniază butoanele automat în funcție de lățimea ecranului de telefon -->
<div class="button-container">

    <!-- BUTON: Hărți Paris general -->

</div>

</body></html>

<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Tudor Dinamic</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        
        #top-panel {
            background: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        #stats-text {
            font-size: 16px;
            font-weight: bold;
            text-align: left;
            line-height: 1.6;
        }

        #game-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0px; 
            max-width: 1200px;
            margin: 0 auto;
        }

        #board {
            display: grid;
            border: 3px solid #333;
            background-color: #fff;
            width: 500px;
            height: 500px;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        .cell {
            border: 1px dashed #bbb;
            box-sizing: border-box;
            width: 100%;
            height: 100%;
        }

        #middle-preview {
            width: 100px;
            height: 100px;
            border-top: 3px solid #333;
            border-bottom: 3px solid #333;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        #preview-image {
            width: 80px;
            height: 80px;
            border: 2px solid #333;
            border-radius: 4px;
            background-image: url('poza.jpg'); 
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            background-color: #ddd;
        }

        #pieces-pool {
            display: grid;
            width: 500px;
            height: 500px;
            border: 3px dashed #888;
            background-color: #e8e8e8;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .piece {
            cursor: grab;
            box-sizing: border-box;
            border: 1px solid rgba(0,0,0,0.15);
            background-image: url('poza.jpg'); 
            background-repeat: no-repeat;
            width: 100%;
            height: 100%;
        }

        select, button {
            padding: 8px 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <h1 id="game-title">Puzzle Foto din poza.jpg</h1>
    
    <div id="top-panel">
        <div>
            <label for="grid-select" style="font-weight: bold; margin-right: 5px;">Dimensiune:</label>
            <select id="grid-select" onchange="changeDifficulty()">
                <option value="4">4 x 4 (16 piese)</option>
                <option value="5" selected>5 x 5 (25 piese)</option>
                <option value="6">6 x 6 (36 piese)</option>
            </select>
        </div>
        <div id="stats-text">
            ⏱️ Timp: <span id="timer">0</span>s | 
            🏆 Record (<span id="record-label">5x5</span>): <span id="best-score">Fără record</span>
        </div>
        <div>
            <button onclick="startGame()">Resetează Jocul</button>
        </div>
    </div>

    <div id="game-container">
        <div id="board"></div>
        
        <div id="middle-preview">
            <div id="preview-image" title="Model de asamblare"></div>
            <span style="font-size: 11px; font-weight: bold; margin-top: 2px;">MODEL</span>
        </div>
        
        <div id="pieces-pool"></div>
    </div>

    <script>
        let ROWS = 5;
        let COLS = 5;
        let timerInterval;
        let timeElapsed = 0;

        window.onload = function() {
            loadBestScore();
            startGame();
        };

        function loadBestScore() {
            document.getElementById('record-label').innerText = `${ROWS}x${COLS}`;
            const savedScore = localStorage.getItem(`puzzle_best_${ROWS}x${COLS}`);
            document.getElementById('best-score').innerText = savedScore ? savedScore + "s" : "Fără record";
        }

        function changeDifficulty() {
            const select = document.getElementById('grid-select');
            ROWS = parseInt(select.value);
            COLS = parseInt(select.value);
            loadBestScore();
            startGame();
        }

        function startGame() {
            clearInterval(timerInterval);
            timeElapsed = 0;
            document.getElementById('timer').innerText = timeElapsed;

            document.getElementById('game-title').innerText = `Puzzle Foto din poza.jpg (${ROWS * COLS} Piese)`;

            const board = document.getElementById('board');
            const pool = document.getElementById('pieces-pool');
            board.innerHTML = '';
            pool.innerHTML = '';

            board.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
            board.style.gridTemplateRows = `repeat(${ROWS}, 1fr)`;
            pool.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
            pool.style.gridTemplateRows = `repeat(${ROWS}, 1fr)`;

            pool.addEventListener('dragover', allowDrop);
            pool.addEventListener('drop', dropPiece);

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    
                    cell.addEventListener('dragover', allowDrop);
                    cell.addEventListener('drop', dropPiece);
                    
                    board.appendChild(cell);
                }
            }

            let pieces = [];

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const piece = document.createElement('div');
                    piece.classList.add('piece');
                    piece.draggable = true;
                    piece.id = "piece-" + r + "-" + c;
                    piece.dataset.correctRow = r;
                    piece.dataset.correctCol = c;

                    // CORECorecție dimensiune fundal dinamic:
                    piece.style.backgroundSize = `${COLS * 100}% ${ROWS * 100}%`;

                    let posX = COLS > 1 ? (c / (COLS - 1)) * 100 : 0;
                    let posY = ROWS > 1 ? (r / (ROWS - 1)) * 100 : 0;
                    piece.style.backgroundPosition = posX + "% " + posY + "%";

                    piece.addEventListener('dragstart', dragStart);
                    pieces.push(piece);
                }
            }      

            pieces.sort(() => Math.random() - 0.5);
            pieces.forEach(p => pool.appendChild(p));

            timerInterval = setInterval(() => {
                timeElapsed++;
                document.getElementById('timer').innerText = timeElapsed;
            }, 1000);
        }

        function dragStart(e) {
            e.dataTransfer.setData("text", e.target.id);
        }

        function allowDrop(e) {
            e.preventDefault();
        }

        function dropPiece(e) {
            e.preventDefault();
            const id = e.dataTransfer.getData("text");
            const piece = document.getElementById(id);
            let target = e.target;

            // Dacă dăm drop pe o piesă deja plasată, găsim celula părinte
            if (target.classList.contains('piece')) {
                target = target.parentNode;
            }

            // Permite plasarea doar în celule goale sau înapoi în pool
            if (target.classList.contains('cell') && target.children.length === 0) {
                target.appendChild(piece);
                checkWin();
            } else if (target.id === 'pieces-pool') {
                target.appendChild(piece);
            }
        }

        function checkWin() {
            const cells = document.querySelectorAll('.cell');
            let win = true;

            cells.forEach(cell => {
                const piece = cell.firstChild;
                if (!piece) {
                    win = false;
                    return;
                }
                if (cell.dataset.row !== piece.dataset.correctRow || cell.dataset.col !== piece.dataset.correctCol) {
                    win = false;
                }
            });

            if (win && cells.length > 0) {
                clearInterval(timerInterval);
                alert(`Felicitări! Ai terminat puzzle-ul în ${timeElapsed} secunde.`);
                
                const currentBest = localStorage.getItem(`puzzle_best_${ROWS}x${COLS}`);
                if (!currentBest || timeElapsed < parseInt(currentBest)) {
                    localStorage.setItem(`puzzle_best_${ROWS}x${COLS}`, timeElapsed);
                    loadBestScore();
                    alert("Nou Record!");
                }
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Puzzle Foto Dinamic</title>
    <style>
        body {
            background-color: #1e222b;
            color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #game-title {
            margin-bottom: 15px;
            color: #ffffff;
        }

        #top-panel {
            background-color: #282c34;
            border: 1px solid #3f4451;
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        select {
            background-color: #353b48;
            color: #ffffff;
            border: 1px solid #4f5769;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }

        select:hover, select:focus {
            border-color: #4cd137;
        }

        #top-panel button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 7px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        #top-panel button:hover {
            background-color: #2ecc71;
        }

        #game-container {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        #board {
            width: 400px;
            height: 400px;
            border: 2px dashed #4f5769;
            background-color: #15181f;
            display: grid;
        }

        .cell {
            border: 1px solid #3f4451;
            box-sizing: border-box;
        }

        #middle-preview {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #preview-image {
            width: 100px;
            height: 100px;
            border: 2px solid #4f5769;
            background-size: cover;
            background-position: center;
        }

        #pieces-pool {
            width: 400px;
            height: 400px;
            border: 2px solid #3f4451;
            background-color: #282c34;
            display: grid;
        }

        .piece {
            border: 1px solid #1e222b;
            box-sizing: border-box;
            cursor: grab;
        }
    </style>
</head>
<body>

    <h1 id="game-title">Puzzle Foto</h1>
    
    <div id="top-panel">
        <div>
            <label for="grid-select" style="font-weight: bold; margin-right: 5px;">Dimensiune:</label>
            <select id="grid-select" onchange="changeDifficulty()">
                <option value="4">4 x 4 (16 piese)</option>
                <option value="5" selected>5 x 5 (25 piese)</option>
                <option value="6">6 x 6 (36 piese)</option>
            </select>
        </div>

        <div>
            <label for="select-imagine" style="font-weight: bold; margin-right: 5px;">Imagine:</label>
            <select id="select-imagine" onchange="changeImage()">
                <!-- REPARAT: Adăugat folderul Fain/ în fața fiecărei poze -->
                <option value="Fain/poza.jpg" selected>Poza 1 (Cățeluș)</option>
                <option value="Fain/poza1.jpg">Poza 2</option>
                <option value="Fain/poza2.jpg">Poza 3</option>
                <option value="Fain/poza3.jpg">Poza 4</option>
                <option value="Fain/poza4.jpg">Poza 5</option>
                <option value="Fain/poza5.jpg">Poza 6</option>
                <option value="Fain/poza6.jpg">Poza 7</option>
                <option value="Fain/poza7.jpg">Poza 8</option>
            </select>
        </div>

        <div id="stats-text">
            ⏱️ Timp: <span id="timer">0</span>s | 
            🏆 Record (<span id="record-label">5x5</span>): <span id="best-score">Fără record</span>
        </div>

        <div>
            <button onclick="startGame()">Resetează Jocul</button>
        </div>
    </div>

    <div id="game-container">
        <div id="board"></div>
        
        <div id="middle-preview">
            <div id="preview-image" title="Model de asamblare"></div>
            <span style="font-size: 11px; font-weight: bold; margin-top: 5px;">MODEL</span>
        </div>
        
        <div id="pieces-pool"></div>
    </div>

    <script>
        let ROWS = 5;
        let COLS = 5;
        let timerInterval;
        let timeElapsed = 0;
        let currentImage = "Fain/poza.jpg"; // REPARAT: Calea inițială corectă

        window.onload = function() {
            loadBestScore();
            startGame();
        };

        function loadBestScore() {
            document.getElementById('record-label').innerText = `${ROWS}x${COLS}`;
            const savedScore = localStorage.getItem(`puzzle_best_${ROWS}x${COLS}`);
            document.getElementById('best-score').innerText = savedScore ? savedScore + "s" : "Fără record";
        }

        function changeDifficulty() {
            const select = document.getElementById('grid-select');
            ROWS = parseInt(select.value);
            COLS = parseInt(select.value);
            loadBestScore();
            startGame();
        }

        function changeImage() {
            const selectImagine = document.getElementById('select-imagine');
            currentImage = selectImagine.value;
            startGame();
        }

        function startGame() {
            clearInterval(timerInterval);
            timeElapsed = 0;
            document.getElementById('timer').innerText = timeElapsed;

            // Curățare nume pentru titlu vizual frumos
            let denumireAfisata = currentImage.replace("Fain/", "");
            document.getElementById('game-title').innerText = `Puzzle Foto din ${denumireAfisata} (${ROWS * COLS} Piese)`;

            document.getElementById('preview-image').style.backgroundImage = `url('${currentImage}')`;

            const board = document.getElementById('board');
            const pool = document.getElementById('pieces-pool');
            board.innerHTML = '';
            pool.innerHTML = '';

            board.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
            board.style.gridTemplateRows = `repeat(${ROWS}, 1fr)`;
            pool.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
            pool.style.gridTemplateRows = `repeat(${ROWS}, 1fr)`;

            pool.addEventListener('dragover', allowDrop);
            pool.addEventListener('drop', dropPiece);

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    
                    cell.addEventListener('dragover', allowDrop);
                    cell.addEventListener('drop', dropPiece);
                    
                    board.appendChild(cell);
                }
            }

            let pieces = [];

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const piece = document.createElement('div');
                    piece.classList.add('piece');
                    piece.draggable = true;
                    piece.id = "piece-" + r + "-" + c;
                    piece.dataset.correctRow = r;
                    piece.dataset.correctCol = c;

                    piece.style.backgroundImage = `url('${currentImage}')`;
                    piece.style.backgroundSize = `${COLS * 100}% ${ROWS * 100}%`;

                    let posX = COLS > 1 ? (c / (COLS - 1)) * 100 : 0;
                    let posY = ROWS > 1 ? (r / (ROWS - 1)) * 100 : 0;
                    piece.style.backgroundPosition = posX + "% " + posY + "%";

                    piece.addEventListener('dragstart', dragStart);
                    pieces.push(piece);
                }
            }      

            pieces.sort(() => Math.random() - 0.5);
            pieces.forEach(p => pool.appendChild(p));

            timerInterval = setInterval(() => {
                timeElapsed++;
                document.getElementById('timer').innerText = timeElapsed;
            }, 1000);
        }

        function dragStart(e) {
            e.dataTransfer.setData("text", e.target.id);
        }

        function allowDrop(e) {
            e.preventDefault();
        }

        function dropPiece(e) {
            e.preventDefault();
            const id = e.dataTransfer.getData("text");
            const piece = document.getElementById(id);
            let target = e.target;

            if (target.classList.contains('piece')) {
                target = target.parentNode;
            }

            if (target.classList.contains('cell') && target.children.length === 0) {
                target.appendChild(piece);
                checkWin();
            } else if (target.id === 'pieces-pool') {
                target.appendChild(piece);
            }
        }

        function checkWin() {
            const cells = document.querySelectorAll('.cell');
            let win = true;

            cells.forEach(cell => {
                const piece = cell.firstChild;
                if (!piece) {
                    win = false;
                    return;
                }
                if (cell.dataset.row !== piece.dataset.correctRow || cell.dataset.col !== piece.dataset.correctCol) {
                    win = false;
                }
            });

            if (win && cells.length > 0) {
